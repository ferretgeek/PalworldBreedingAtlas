[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "palworld-breeding-atlas"
version = "3.5.0"
description = "Local-first Palworld breeding atlas and read-only save companion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = {file = "LICENSE"}

[project.scripts]
pal-breed-helper = "pal_breed_helper.app:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pal_breed_helper = [
  "assets/*",
  "assets/data/*",
  "assets/images/pals/*",
  "assets/images/work/*",
  "data/*",
]
